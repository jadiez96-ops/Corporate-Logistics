[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile --prod=false"]

[phases.build]
cmds = [
  "PORT=4173 BASE_PATH=/ NODE_ENV=production pnpm --filter @workspace/ectsa-website run build",
  "pnpm --filter @workspace/api-server run build"
]

[start]
cmd = "NODE_ENV=production pnpm --filter @workspace/api-server run start"